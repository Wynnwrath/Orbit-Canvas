version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: orbit-canvas-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orbit-canvas-server
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/orbit-canvas
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orbit-canvas-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

volumes:
  mongo-data:
